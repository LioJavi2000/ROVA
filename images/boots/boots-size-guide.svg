<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 940" width="750" height="940">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#C4614A"/>
    </marker>
    <marker id="at" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#C4614A"/>
    </marker>
    <marker id="sv" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6B7060"/>
    </marker>
    <marker id="svr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6B7060"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="750" height="940" fill="#F0E8DA"/>

  <!-- Brand -->
  <text x="375" y="58" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="bold" fill="#2B1F14" letter-spacing="3">Rova</text>

  <!-- Title -->
  <text x="375" y="115" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="42" font-weight="700" fill="#2B1F14" letter-spacing="1">PAW BOOTS SIZE GUIDE</text>

  <!-- Table header -->
  <rect x="56" y="140" width="638" height="54" fill="#C4614A"/>
  <line x1="256" y1="140" x2="256" y2="194" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <line x1="486" y1="140" x2="486" y2="194" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <text x="156" y="173" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="16" font-weight="600" fill="white">Size</text>
  <text x="371" y="173" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="16" font-weight="600" fill="white">Inside Width (inches)</text>
  <text x="573" y="173" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="16" font-weight="600" fill="white">Inside Length (inches)</text>

  <!-- Row 1 -->
  <rect x="56" y="194" width="638" height="48" fill="white"/>
  <line x1="256" y1="194" x2="256" y2="242" stroke="#DDD6CC" stroke-width="1"/>
  <line x1="486" y1="194" x2="486" y2="242" stroke="#DDD6CC" stroke-width="1"/>
  <line x1="56" y1="242" x2="694" y2="242" stroke="#DDD6CC" stroke-width="1"/>
  <text x="156" y="224" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="16" fill="#2B1F14">2</text>
  <text x="371" y="224" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="16" fill="#2B1F14">1.6 in</text>
  <text x="573" y="224" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="16" fill="#2B1F14">2.4 in</text>

  <!-- Row 2 -->
  <rect x="56" y="242" width="638" height="48" fill="#F8F4EF"/>
  <line x1="256" y1="242" x2="256" y2="290" stroke="#DDD6CC" stroke-width="1"/>
  <line x1="486" y1="242" x2="486" y2="290" stroke="#DDD6CC" stroke-width="1"/>
  <line x1="56" y1="290" x2="694" y2="290" stroke="#DDD6CC" stroke-width="1"/>
  <text x="156" y="272" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="16" fill="#2B1F14">3</text>
  <text x="371" y="272" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="16" fill="#2B1F14">1.8 in</text>
  <text x="573" y="272" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="16" fill="#2B1F14">2.4 in</text>

  <!-- Row 3 -->
  <rect x="56" y="290" width="638" height="48" fill="white"/>
  <line x1="256" y1="290" x2="256" y2="338" stroke="#DDD6CC" stroke-width="1"/>
  <line x1="486" y1="290" x2="486" y2="338" stroke="#DDD6CC" stroke-width="1"/>
  <line x1="56" y1="338" x2="694" y2="338" stroke="#DDD6CC" stroke-width="1"/>
  <text x="156" y="320" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="16" fill="#2B1F14">4</text>
  <text x="371" y="320" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="16" fill="#2B1F14">2.0 in</text>
  <text x="573" y="320" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="16" fill="#2B1F14">2.6 in</text>

  <!-- Row 4 -->
  <rect x="56" y="338" width="638" height="48" fill="#F8F4EF"/>
  <line x1="256" y1="338" x2="256" y2="386" stroke="#DDD6CC" stroke-width="1"/>
  <line x1="486" y1="338" x2="486" y2="386" stroke="#DDD6CC" stroke-width="1"/>
  <line x1="56" y1="386" x2="694" y2="386" stroke="#DDD6CC" stroke-width="1"/>
  <text x="156" y="368" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="16" fill="#2B1F14">5</text>
  <text x="371" y="368" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="16" fill="#2B1F14">2.2 in</text>
  <text x="573" y="368" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="16" fill="#2B1F14">2.8 in</text>

  <!-- Row 5 -->
  <rect x="56" y="386" width="638" height="48" fill="white"/>
  <line x1="256" y1="386" x2="256" y2="434" stroke="#DDD6CC" stroke-width="1"/>
  <line x1="486" y1="386" x2="486" y2="434" stroke="#DDD6CC" stroke-width="1"/>
  <line x1="56" y1="434" x2="694" y2="434" stroke="#DDD6CC" stroke-width="1"/>
  <text x="156" y="416" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="16" fill="#2B1F14">6</text>
  <text x="371" y="416" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="16" fill="#2B1F14">2.5 in</text>
  <text x="573" y="416" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="16" fill="#2B1F14">3.0 in</text>

  <!-- Row 6 -->
  <rect x="56" y="434" width="638" height="48" fill="#F8F4EF"/>
  <line x1="256" y1="434" x2="256" y2="482" stroke="#DDD6CC" stroke-width="1"/>
  <line x1="486" y1="434" x2="486" y2="482" stroke="#DDD6CC" stroke-width="1"/>
  <line x1="56" y1="482" x2="694" y2="482" stroke="#DDD6CC" stroke-width="1"/>
  <text x="156" y="464" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="16" fill="#2B1F14">7</text>
  <text x="371" y="464" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="16" fill="#2B1F14">2.8 in</text>
  <text x="573" y="464" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="16" fill="#2B1F14">3.1 in</text>

  <!-- Row 7 -->
  <rect x="56" y="482" width="638" height="48" fill="white"/>
  <line x1="256" y1="482" x2="256" y2="530" stroke="#DDD6CC" stroke-width="1"/>
  <line x1="486" y1="482" x2="486" y2="530" stroke="#DDD6CC" stroke-width="1"/>
  <line x1="56" y1="530" x2="694" y2="530" stroke="#DDD6CC" stroke-width="1"/>
  <text x="156" y="512" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="16" fill="#2B1F14">8</text>
  <text x="371" y="512" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="16" fill="#2B1F14">3.0 in</text>
  <text x="573" y="512" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="16" fill="#2B1F14">3.3 in</text>

  <!-- Table border -->
  <rect x="56" y="140" width="638" height="390" fill="none" stroke="#C8BFB5" stroke-width="1.5"/>

  <!-- Divider -->
  <line x1="56" y1="558" x2="694" y2="558" stroke="#C8BFB5" stroke-width="1"/>

  <!-- How to measure -->
  <text x="56" y="600" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="bold" fill="#2B1F14">How to measure</text>

  <!-- Steps -->
  <text x="56" y="638" font-family="'DM Sans', Arial, sans-serif" font-size="15" fill="#2B1F14">1.  Put your dog's paw on a blank sheet of paper.</text>
  <text x="56" y="665" font-family="'DM Sans', Arial, sans-serif" font-size="15" fill="#2B1F14">2.  Trace a circle around the paw including toenails.</text>
  <text x="56" y="692" font-family="'DM Sans', Arial, sans-serif" font-size="15" fill="#2B1F14">3.  Measure the maximum width and length inside the circle.</text>
  <text x="56" y="719" font-family="'DM Sans', Arial, sans-serif" font-size="15" fill="#2B1F14">4.  Match measurements to the size chart above.</text>

  <!-- Paw diagram area -->
  <!-- Width label + arrow -->
  <text x="548" y="612" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="14" font-weight="600" fill="#C4614A">Width</text>
  <line x1="466" y1="623" x2="630" y2="623" stroke="#C4614A" stroke-width="2" marker-start="url(#at)" marker-end="url(#ah)"/>

  <!-- Sage arch (top of paw) -->
  <path d="M 476,760 Q 476,668 548,668 Q 620,668 620,760" fill="none" stroke="#6B7060" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Toe pads: 3 top toes -->
  <ellipse cx="505" cy="690" rx="17" ry="14" fill="#F0E8DA" stroke="#C4614A" stroke-width="2"/>
  <ellipse cx="548" cy="680" rx="17" ry="14" fill="#F0E8DA" stroke="#C4614A" stroke-width="2"/>
  <ellipse cx="591" cy="690" rx="17" ry="14" fill="#F0E8DA" stroke="#C4614A" stroke-width="2"/>

  <!-- Main paw pad (large ellipse) -->
  <ellipse cx="548" cy="780" rx="72" ry="58" fill="#F0E8DA" stroke="#C4614A" stroke-width="2.5"/>

  <!-- Side toe pads -->
  <ellipse cx="464" cy="748" rx="16" ry="20" fill="#F0E8DA" stroke="#C4614A" stroke-width="2"/>
  <ellipse cx="632" cy="748" rx="16" ry="20" fill="#F0E8DA" stroke="#C4614A" stroke-width="2"/>

  <!-- Length arrow + label (right side, vertical) -->
  <line x1="668" y1="668" x2="668" y2="838" stroke="#6B7060" stroke-width="2" marker-start="url(#svr)" marker-end="url(#sv)"/>
  <text x="686" y="760" text-anchor="start" font-family="'DM Sans', Arial, sans-serif" font-size="14" font-weight="600" fill="#6B7060" transform="rotate(90,686,760)">Length</text>
</svg>
