<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 750 760" width="750" height="760">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#C4614A"/>
    </marker>
    <marker id="arrl" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6 Z" fill="#C4614A"/>
    </marker>
    <marker id="arrd" markerWidth="6" markerHeight="8" refX="3" refY="8" orient="auto">
      <path d="M0,0 L3,8 L6,0 Z" fill="#C4614A"/>
    </marker>
    <marker id="arru" markerWidth="6" markerHeight="8" refX="3" refY="0" orient="auto">
      <path d="M0,8 L3,0 L6,8 Z" fill="#C4614A"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="750" height="760" fill="#F0E8DA"/>

  <!-- Brand + Title -->
  <text x="375" y="52" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold" fill="#2B1F14" letter-spacing="3">Rova</text>
  <text x="375" y="96" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="36" font-weight="700" fill="#2B1F14" letter-spacing="1">SLOW FEEDER SIZE GUIDE</text>
  <text x="375" y="122" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="14" fill="#6B7060">Designed for small and medium dogs</text>

  <!-- Actual product photo -->
  <image href="bowl-pink.png" x="125" y="140" width="500" height="500" preserveAspectRatio="xMidYMid meet"/>

  <!-- ============= DIMENSION LINES ============= -->

  <!-- TOP WIDTH: 7.3 in — arrow across top of bowl opening -->
  <!-- Bowl top edge is roughly at y=185, spanning x≈195 to x≈555 -->
  <line x1="195" y1="166" x2="195" y2="186" stroke="#C4614A" stroke-width="1.5"/>
  <line x1="555" y1="166" x2="555" y2="186" stroke="#C4614A" stroke-width="1.5"/>
  <line x1="203" y1="174" x2="547" y2="174" stroke="#C4614A" stroke-width="1.5" marker-start="url(#arrl)" marker-end="url(#arr)"/>
  <rect x="323" y="155" width="104" height="22" rx="4" fill="#F0E8DA"/>
  <text x="375" y="171" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="15" font-weight="700" fill="#2B1F14">7.3 in wide</text>

  <!-- BASE WIDTH: 9.3 in — arrow across base of bowl -->
  <!-- Bowl base is roughly at y=620, spanning x≈155 to x≈595 -->
  <line x1="155" y1="628" x2="155" y2="648" stroke="#C4614A" stroke-width="1.5"/>
  <line x1="595" y1="628" x2="595" y2="648" stroke="#C4614A" stroke-width="1.5"/>
  <line x1="163" y1="638" x2="587" y2="638" stroke="#C4614A" stroke-width="1.5" marker-start="url(#arrl)" marker-end="url(#arr)"/>
  <rect x="323" y="626" width="104" height="22" rx="4" fill="#F0E8DA"/>
  <text x="375" y="642" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="15" font-weight="700" fill="#2B1F14">9.3 in base</text>

  <!-- HEIGHT: 2 in — right side vertical arrow -->
  <!-- Bowl height spans roughly y=186 to y=628 on right edge x≈590 -->
  <line x1="608" y1="186" x2="628" y2="186" stroke="#C4614A" stroke-width="1.5"/>
  <line x1="608" y1="628" x2="628" y2="628" stroke="#C4614A" stroke-width="1.5"/>
  <line x1="620" y1="194" x2="620" y2="620" stroke="#C4614A" stroke-width="1.5" marker-start="url(#arru)" marker-end="url(#arrd)"/>
  <rect x="628" y="388" width="60" height="22" rx="4" fill="#F0E8DA"/>
  <text x="658" y="404" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="15" font-weight="700" fill="#2B1F14">2 in</text>

  <!-- MAZE DEPTH: 0.1 in — callout line pointing to bowl interior -->
  <line x1="375" y1="360" x2="102" y2="310" stroke="#B5A898" stroke-width="1.5"/>
  <circle cx="375" cy="360" r="4" fill="#B5A898"/>
  <text x="98" y="305" text-anchor="end" font-family="'DM Sans', Arial, sans-serif" font-size="13" fill="#6B7060">maze depth: 0.1 in</text>

  <!-- Bottom divider -->
  <line x1="56" y1="680" x2="694" y2="680" stroke="#C8BFB5" stroke-width="1"/>

  <!-- Bottom specs -->
  <text x="190" y="712" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="14" font-weight="600" fill="#2B1F14">BPA-Free Silicone</text>
  <text x="375" y="712" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="14" font-weight="600" fill="#2B1F14">Dishwasher Safe</text>
  <text x="560" y="712" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="14" font-weight="600" fill="#2B1F14">Non-Slip Base</text>
  <circle cx="282" cy="708" r="3" fill="#C4614A"/>
  <circle cx="468" cy="708" r="3" fill="#C4614A"/>

  <!-- Capacity note -->
  <text x="375" y="742" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="13" fill="#6B7060">Approx. capacity: 3 cups / 720 mL</text>
</svg>
