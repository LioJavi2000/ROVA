<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 680" width="750" height="680">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#C4614A"/>
    </marker>
    <marker id="arrl" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6 Z" fill="#C4614A"/>
    </marker>
    <marker id="arrd" markerWidth="6" markerHeight="8" refX="3" refY="8" orient="auto">
      <path d="M0,0 L3,8 L6,0 Z" fill="#C4614A"/>
    </marker>
    <marker id="arru" markerWidth="6" markerHeight="8" refX="3" refY="0" orient="auto">
      <path d="M0,8 L3,0 L6,8 Z" fill="#C4614A"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="750" height="680" fill="#F0E8DA"/>

  <!-- Brand + Title -->
  <text x="375" y="52" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold" fill="#2B1F14" letter-spacing="3">Rova</text>
  <text x="375" y="100" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="38" font-weight="700" fill="#2B1F14" letter-spacing="1">SLOW FEEDER SIZE GUIDE</text>
  <text x="375" y="128" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="15" fill="#6B7060">Designed for small and medium dogs</text>

  <!-- ============================================================
       BOWL CROSS-SECTION (front view, slightly angled)
       Bowl is hexagonal, showing cross-section:
       - Outer base is wider (9.3 in)
       - Top opening is slightly narrower (7.3 in)
       - Height is 2 in
       ============================================================ -->

  <!-- Bowl coordinate system: centered at x=375, base at y=540 -->
  <!-- Scale: ~52px per inch -->
  <!-- Top width 7.3 in → 380px wide → ±190px from center → x: 185 to 565 -->
  <!-- Base width 9.3 in → 484px wide → ±242px from center → x: 133 to 617 -->
  <!-- Height 2 in → 104px → top at y=436, base at y=540 -->

  <!-- Bowl outer shell (filled, cream) -->
  <path d="M 133,540 L 185,436 L 565,436 L 617,540 Z" fill="#EDE2D1" stroke="#2B1F14" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Inner bowl cavity (maze zone) -->
  <!-- Inner walls are ~0.1in thick ≈ 5px inset at top -->
  <path d="M 147,536 L 193,440 L 557,440 L 603,536 Z" fill="#F0E8DA" stroke="#B5A898" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Maze pattern (simplified bone/peg shapes) inside bowl -->
  <!-- Row 1 of pegs -->
  <rect x="230" y="462" width="18" height="30" rx="9" fill="#C4614A" opacity="0.55"/>
  <rect x="268" y="455" width="14" height="48" rx="7" fill="#C4614A" opacity="0.55"/>
  <rect x="302" y="462" width="18" height="30" rx="9" fill="#C4614A" opacity="0.55"/>
  <rect x="343" y="455" width="14" height="48" rx="7" fill="#C4614A" opacity="0.55"/>
  <rect x="378" y="462" width="18" height="30" rx="9" fill="#C4614A" opacity="0.55"/>
  <rect x="415" y="455" width="14" height="48" rx="7" fill="#C4614A" opacity="0.55"/>
  <rect x="452" y="462" width="18" height="30" rx="9" fill="#C4614A" opacity="0.55"/>
  <rect x="490" y="455" width="14" height="48" rx="7" fill="#C4614A" opacity="0.55"/>

  <!-- Horizontal connectors between pegs (bone shape) -->
  <rect x="243" y="470" width="30" height="8" rx="4" fill="#C4614A" opacity="0.4"/>
  <rect x="315" y="470" width="30" height="8" rx="4" fill="#C4614A" opacity="0.4"/>
  <rect x="393" y="470" width="25" height="8" rx="4" fill="#C4614A" opacity="0.4"/>
  <rect x="465" y="470" width="28" height="8" rx="4" fill="#C4614A" opacity="0.4"/>

  <!-- Center peg -->
  <circle cx="375" cy="503" r="10" fill="#C4614A" opacity="0.55"/>

  <!-- Row 2 of shorter pegs -->
  <rect x="248" y="500" width="14" height="24" rx="7" fill="#C4614A" opacity="0.4"/>
  <rect x="323" y="500" width="14" height="24" rx="7" fill="#C4614A" opacity="0.4"/>
  <rect x="410" y="500" width="14" height="24" rx="7" fill="#C4614A" opacity="0.4"/>
  <rect x="482" y="500" width="14" height="24" rx="7" fill="#C4614A" opacity="0.4"/>

  <!-- Bowl rim at top -->
  <rect x="183" y="430" width="384" height="10" rx="3" fill="#2B1F14" opacity="0.15"/>
  <rect x="183" y="430" width="384" height="6" rx="3" fill="#B5A898"/>

  <!-- Flat bottom base strip -->
  <rect x="155" y="537" width="440" height="8" rx="3" fill="#B5A898"/>

  <!-- =================== DIMENSION LINES =================== -->

  <!-- TOP WIDTH: 7.3 in — above the bowl -->
  <!-- Vertical tick lines at top opening edges -->
  <line x1="185" y1="410" x2="185" y2="436" stroke="#C4614A" stroke-width="1.5"/>
  <line x1="565" y1="410" x2="565" y2="436" stroke="#C4614A" stroke-width="1.5"/>
  <!-- Horizontal arrow line -->
  <line x1="193" y1="418" x2="557" y2="418" stroke="#C4614A" stroke-width="1.5" marker-start="url(#arrl)" marker-end="url(#arr)"/>
  <!-- Label -->
  <text x="375" y="408" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="15" font-weight="600" fill="#2B1F14">7.3 in</text>

  <!-- BASE WIDTH: 9.3 in — below the bowl -->
  <line x1="133" y1="548" x2="133" y2="572" stroke="#C4614A" stroke-width="1.5"/>
  <line x1="617" y1="548" x2="617" y2="572" stroke="#C4614A" stroke-width="1.5"/>
  <line x1="141" y1="562" x2="609" y2="562" stroke="#C4614A" stroke-width="1.5" marker-start="url(#arrl)" marker-end="url(#arr)"/>
  <text x="375" y="590" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="15" font-weight="600" fill="#2B1F14">9.3 in</text>

  <!-- HEIGHT: 2 in — right side -->
  <line x1="628" y1="436" x2="660" y2="436" stroke="#C4614A" stroke-width="1.5"/>
  <line x1="628" y1="540" x2="660" y2="540" stroke="#C4614A" stroke-width="1.5"/>
  <line x1="650" y1="444" x2="650" y2="532" stroke="#C4614A" stroke-width="1.5" marker-start="url(#arru)" marker-end="url(#arrd)"/>
  <text x="672" y="494" text-anchor="start" font-family="'DM Sans', Arial, sans-serif" font-size="15" font-weight="600" fill="#2B1F14">2 in</text>

  <!-- MAZE DEPTH: 0.1 in — left side callout -->
  <!-- Pointing at the inner wall thickness at top left -->
  <line x1="185" y1="436" x2="193" y2="440" stroke="#B5A898" stroke-width="1.5"/>
  <!-- Callout line going left -->
  <line x1="185" y1="436" x2="105" y2="420" stroke="#B5A898" stroke-width="1.5"/>
  <circle cx="185" cy="436" r="3" fill="#B5A898"/>
  <text x="100" y="415" text-anchor="end" font-family="'DM Sans', Arial, sans-serif" font-size="13" fill="#6B7060">wall: 0.1 in</text>

  <!-- =================== SPEC CALLOUTS =================== -->
  <rect x="56" y="614" width="638" height="1" fill="#C8BFB5"/>

  <!-- Bottom specs row -->
  <text x="190" y="646" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="14" font-weight="600" fill="#2B1F14">BPA-Free Silicone</text>
  <text x="375" y="646" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="14" font-weight="600" fill="#2B1F14">Dishwasher Safe</text>
  <text x="560" y="646" text-anchor="middle" font-family="'DM Sans', Arial, sans-serif" font-size="14" font-weight="600" fill="#2B1F14">Non-Slip Base</text>

  <!-- Dot separators -->
  <circle cx="282" cy="642" r="3" fill="#C4614A"/>
  <circle cx="468" cy="642" r="3" fill="#C4614A"/>
</svg>
